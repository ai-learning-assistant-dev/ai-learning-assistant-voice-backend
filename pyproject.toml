[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning-assistant-voice-backend"
version = "0.1.0"
description = "AI learning assistant voice backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "click",
    "fastapi",
    "numpy>=2.0.0,<3.0.0",
    "soundfile",
    "uvicorn",
    "toml",
    "en-core-web-sm>=3.8.0",
]

[project.optional-dependencies]
kokoro = [
    "kokoro==0.9.4",
    "misaki[zh]>=0.8.2",
    "soundfile",
]
torch-cpu = [
    "torch==2.5.1+cpu",
]
torch-cu121 = [
    "torch==2.5.1+cu121",
]
# "f5-tts" = [
#     "f5-tts==1.1.4",
# ]

[project.scripts]
ai-tts-cli = "cli:cli"
ai-tts-test = "test_client:main"

[[tool.uv.index]]
# Use Aliyun mirror for PyPI
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[[tool.uv.index]]
name = "huaweicloud"
url = "https://mirrors.huaweicloud.com/repository/pypi/simple/"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv]
conflicts = [[{ extra = "torch-cpu" }, { extra = "torch-cu121" }]]
python-downloads = "automatic"
# Use GitHub mirror for managed Python downloads
python-install-mirror = "https://python-standalone.org/mirror/astral-sh/python-build-standalone/"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "torch-cpu" },
    { index = "pytorch-cu121", extra = "torch-cu121" },
]
en-core-web-sm = [
    { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" },
]